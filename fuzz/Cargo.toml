[package]
name = "chronoseal-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]
libfuzzer-sys = "0.4"
shared = { path = "../shared" }
serde_json = "1"

[workspace]

[[bin]]
name = "vm"
path = "fuzz_targets/vm.rs"
test = false
doc = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false

[[bin]]
name = "environment"
path = "fuzz_targets/environment.rs"
test = false
doc = false
